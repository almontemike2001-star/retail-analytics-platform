name: beanflow
version: '1.0.0'
config-version: 2

profile: beanflow

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - target
  - dbt_packages

models:
  beanflow:
    staging:
      +materialized: view
      +schema: silver
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: gold
