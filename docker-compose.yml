name: beanflow

services:
  postgres-source:
    image: postgres:16
    container_name: beanflow-postgres-source
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beanflow}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set - copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - copy .env.example to .env}
      TZ: UTC
      PGTZ: UTC

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres_source_data:/var/lib/postgresql/data
      - ./source_db/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_source_data:
    name: beanflow_postgres_source_data
