# Explicit schema for pos.stores (source of truth for PostgreSQL checks, PyArrow and BigQuery).
# Types: int64 | string | bool | date | timestamp (UTC) | decimal(P,S). Order = source column order.
table: stores
columns:
  - {name: store_id, type: "int64", nullable: false}
  - {name: area_id, type: "int64", nullable: false}
  - {name: store_code, type: "string", nullable: false}
  - {name: store_name, type: "string", nullable: false}
  - {name: store_type, type: "string", nullable: false}
  - {name: city, type: "string", nullable: false}
  - {name: latitude, type: "decimal(9,6)", nullable: true}
  - {name: longitude, type: "decimal(9,6)", nullable: true}
  - {name: opened_date, type: "date", nullable: false}
  - {name: closed_date, type: "date", nullable: true}
  - {name: status, type: "string", nullable: false}
  - {name: updated_at, type: "timestamp", nullable: false}
