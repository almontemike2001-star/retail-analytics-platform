# Explicit schema for pos.products (source of truth for PostgreSQL checks, PyArrow and BigQuery).
# Types: int64 | string | bool | date | timestamp (UTC) | decimal(P,S). Order = source column order.
table: products
columns:
  - {name: product_id, type: "int64", nullable: false}
  - {name: category_id, type: "int64", nullable: false}
  - {name: sku, type: "string", nullable: false}
  - {name: product_name, type: "string", nullable: false}
  - {name: size, type: "string", nullable: true}
  - {name: base_price, type: "decimal(12,2)", nullable: false}
  - {name: unit_cost, type: "decimal(12,2)", nullable: false}
  - {name: is_active, type: "bool", nullable: false}
  - {name: launched_date, type: "date", nullable: false}
  - {name: updated_at, type: "timestamp", nullable: false}
