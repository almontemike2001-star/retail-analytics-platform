# Explicit schema for pos.order_items (source of truth for PostgreSQL checks, PyArrow and BigQuery).
# Types: int64 | string | bool | date | timestamp (UTC) | decimal(P,S). Order = source column order.
table: order_items
columns:
  - {name: order_item_id, type: "int64", nullable: false}
  - {name: order_id, type: "int64", nullable: false}
  - {name: product_id, type: "int64", nullable: false}
  - {name: quantity, type: "int64", nullable: false}
  - {name: unit_price, type: "decimal(12,2)", nullable: false}
  - {name: line_discount, type: "decimal(12,2)", nullable: false}
  - {name: line_total, type: "decimal(12,2)", nullable: false}
  - {name: updated_at, type: "timestamp", nullable: false}
