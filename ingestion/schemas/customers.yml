# Explicit schema for pos.customers (source of truth for PostgreSQL checks, PyArrow and BigQuery).
# Types: int64 | string | bool | date | timestamp (UTC) | decimal(P,S). Order = source column order.
table: customers
columns:
  - {name: customer_id, type: "int64", nullable: false}
  - {name: full_name, type: "string", nullable: false}
  - {name: email, type: "string", nullable: true}
  - {name: phone, type: "string", nullable: true}
  - {name: birth_date, type: "date", nullable: true}
  - {name: gender, type: "string", nullable: true}
  - {name: city, type: "string", nullable: true}
  - {name: signup_date, type: "date", nullable: false}
  - {name: signup_store_id, type: "int64", nullable: true}
  - {name: loyalty_tier, type: "string", nullable: false}
  - {name: updated_at, type: "timestamp", nullable: false}
